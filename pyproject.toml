[project]
name = "pymopsmap"
version = "0.4.0"
description = "Python wrapper for MOPSMAP aerosol optical properties computation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "walcark", email = "kevin.walcarius@gmail.com" }]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydantic>=2.0",
  "xarray>=2024.1",
  "numpy>=2.0",
  "scipy>=1.10",
  "tqdm>=4.0",
  "einops>=0.7",
  "structlog>=24.0",
  "netcdf4>=1.7",
]

[project.urls]
Homepage = "https://github.com/walcark/pymopsmap"
Issues = "https://github.com/walcark/pymopsmap/issues"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# The species catalogue lives inside the package, so it ships in the wheel.
[tool.hatch.build.targets.wheel]
packages = ["src/pymopsmap"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
pymopsmap = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "3.12.*"
# The MOPSMAP binary is linked against the NetCDF Fortran bindings.
netcdf-fortran = ">=4.6,<5"
xarray = ">=2025.11.0,<2026"
numpy = ">=2.3.5,<3"
black = ">=25.1.0,<26"
pydantic = ">=2.12.4,<3"
netcdf4 = ">=1.7.3,<2"
matplotlib = ">=3.10.8,<4"
structlog = ">=25.0,<26"
scipy = ">=1.16.3,<2"
einops = ">=0.8.1,<0.9"
tqdm = ">=4.67.1,<5"
httpx = ">=0.28.0,<0.29"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
builder = { features = ["builder"] }

[tool.pixi.feature.dev.dependencies]
ruff = "*"
mypy = ">=1.5"
pre-commit = ">=4.4.0,<5"
pytest = ">=9.0.1,<10"
pytest-cov = ">=6.0"

[tool.pixi.feature.dev.tasks]
fmt = { cmd = "ruff format ." }
lint = { cmd = "ruff check ." }
type-check = { cmd = "mypy src/pymopsmap" }
test = { cmd = "python -m pytest tests --cov=src/pymopsmap --cov-report=xml", env = { PYMOPSMAP_CACHE_DIR = "tests/data/cache" } }
all = { depends-on = ["fmt", "lint", "type-check", "test"] }

[tool.pixi.feature.builder.dependencies]
python = "3.12.*"
pip = ">=23.0"

[tool.pixi.feature.builder.tasks]
install-build = { cmd = "python -m pip install --upgrade build twine" }
build = { cmd = "python -m build" }

[tool.ruff]
line-length = 79
exclude = [".pixi/", "bin/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
