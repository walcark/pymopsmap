[project]
authors = [{ name = "walcark", email = "kevin.walcarius@cnes.fr" }]
dependencies = []
name = "pymopsmap"
requires-python = ">= 3.11"
version = "0.2.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
pymopsmap = { path = ".", editable = true }

[tool.pixi.tasks]
run = "python -m pymopsmap.core.opticalprops"
run-debug = "PYMOPSMAP_KEEP_TEMP=1 pixi run python -m pymopsmap.core.opticalprops"
test = "DATA_PATH=tests/data pytest tests"

[tool.pixi.dependencies]
python = "3.12.*"
xarray = ">=2025.11.0,<2026"
numpy = ">=2.3.5,<3"
black = ">=25.1.0,<26"
pydantic = ">=2.12.4,<3"
netcdf4 = ">=1.7.3,<2"
matplotlib = ">=3.10.8,<4"
structlog = ">=25.0,<26"
scipy = ">=1.16.3,<2"
einops = ">=0.8.1,<0.9"
tqdm = ">=4.67.1,<5"
httpx = ">=0.28.0,<0.29"

[tool.pixi.environments]
default = { solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.feature.dev.dependencies]
ruff = "*"
pre-commit = ">=4.4.0,<5"
pytest = ">=9.0.1,<10"

[tool.ruff]
line-length = 88
exclude = [".pixi/", "bin/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[dependency-groups]
test = ["pytest"]
